name: Yayın kontrolü

on:
  schedule:
    - cron: "17 6 * * 1"  # her pazartesi 09:17 (TSİ)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [turkiye.m3u]

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Adresleri kontrol et
        run: python scripts/check_streams.py turkiye.m3u | tee report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Rapor issue'sunu güncelle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Yayın kontrolü raporu"
          num=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if grep -q '^| Grup |' report.md; then
            if [ -n "$num" ]; then
              gh issue edit "$num" --body-file report.md
            else
              gh issue create --title "$title" --body-file report.md
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "Tüm kanallar yanıt veriyor."
          fi
